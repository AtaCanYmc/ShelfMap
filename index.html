<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shelfmap-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0f14" />
    <meta name="description" content="ShelfMap - Hierarchical workshop and home inventory manager with Bring-Your-Own-Supabase (BYOS) and QR code tracking" />
    <link rel="apple-touch-icon" href="/shelfmap-icon.svg" />
    <title>ShelfMap - Smart Workshop & Container Inventory Map</title>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('shelfmap_theme');
          var theme = savedTheme === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var savedLang = localStorage.getItem('shelfmap_language');
          if (savedLang) {
            document.documentElement.setAttribute('lang', savedLang);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
